name: Build

on:
  workflow_call:
    inputs:
      files:
        description: Newline separated list of files to build
        required: true
        type: string
      esphome-version:
        description: Version of ESPHome to build with
        required: false
        type: string
        default: latest
      release-summary:
        description: Summary of the release
        required: false
        type: string
        default: ""
      release-url:
        description: URL to the release notes
        required: false
        type: string
        default: ""
      release-version:
        description: Version of the release
        required: false
        type: string
        default: ""
      combined-name:
        description: Combine all files into a single manifest under this name
        required: false
        type: string
        default: ""
      name-from-file:
        description: >-
          Name the firmware files and the artifact after the YAML file
          instead of esphome.name, so several configs that share a device
          name (e.g. hardware revisions) build side by side. The name is the
          file name without its .yaml/.yml extension and without a trailing
          .factory, so my-device-rev-a.factory.yaml becomes my-device-rev-a.
          The chip variant is still appended to the firmware file names,
          e.g. my-device-rev-a-esp32c3.factory.bin.
        required: false
        type: boolean
        default: false

    outputs:
      version:
        description: Version of the firmware generated
        value: ${{ jobs.prepare.outputs.version }}

jobs:
  prepare:
    name: Prepare
    runs-on: ubuntu-latest
    outputs:
      files: ${{ steps.files-array.outputs.files }}
      version: ${{ steps.version.outputs.version }}
      artifact-prefix: ${{ steps.artifact-name.outputs.artifact-prefix }}
    steps:
      - name: Split files input into JSON array
        id: files-array
        run: |
          files=$(echo "${{ inputs.files }}" | jq -RcSn '[inputs | select(length>0)]')
          echo files=$files >> $GITHUB_OUTPUT
      - name: Generate version
        id: version
        run: |
          if [ -n "${{ inputs.release-version }}" ]; then
            version=${{ inputs.release-version }}
          else
            version=dev-$(date +'%Y%m%d-%H%M')
          fi

          echo version=$version >> $GITHUB_OUTPUT
      - name: Generated random artifact prefix
        id: artifact-name
        run: |
          artifact_prefix=$(tr -dc A-Za-z0-9 </dev/urandom | head -c 16; echo)
          echo artifact-prefix=$artifact_prefix >> $GITHUB_OUTPUT

  build:
    name: ${{ matrix.file }}
    needs: [prepare]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 10
      matrix:
        file: ${{ fromJson(needs.prepare.outputs.files) }}
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Replace project version
        run: |
          sed -i "s/version: dev/version: \"${{ needs.prepare.outputs.version }}\"/g" ${{ matrix.file }}
      - name: Build Firmware
        uses: esphome/build-action@ae5408cdbc4f70692bf8e345c4982bca05a93667 # v8.1.0
        id: esphome-build
        with:
          yaml-file: ${{ matrix.file }}
          version: ${{ inputs.esphome-version }}
          complete-manifest: true
          release-summary: ${{ inputs.release-summary }}
          release-url: ${{ inputs.release-url }}
      # build-name is the base of the firmware file names and name is the
      # artifact name. By default both come from esphome.name (via the build
      # action's outputs); with name-from-file they come from the YAML file.
      - name: Determine artifact name
        id: artifact
        env:
          NAME_FROM_FILE: ${{ inputs.name-from-file }}
          COMBINED_NAME: ${{ inputs.combined-name }}
          ARTIFACT_PREFIX: ${{ needs.prepare.outputs.artifact-prefix }}
          MATRIX_FILE: ${{ matrix.file }}
          BUILD_ACTION_NAME: ${{ steps.esphome-build.outputs.name }}
          ORIGINAL_NAME: ${{ steps.esphome-build.outputs.original-name }}
        run: |
          set -euo pipefail
          if [ "$NAME_FROM_FILE" = "true" ]; then
            # Drop the directory, the .yaml/.yml extension and a trailing
            # .factory from the file name.
            stem=$(basename "$MATRIX_FILE")
            case "$stem" in
              *.yaml) stem="${stem%.yaml}" ;;
              *.yml) stem="${stem%.yml}" ;;
            esac
            stem="${stem%.factory}"
            if [ -z "$stem" ]; then
              echo "::error::Cannot derive a name from file '$MATRIX_FILE'"
              exit 1
            fi
            # The build action appends the chip variant to esphome.name.
            variant="${BUILD_ACTION_NAME#"$ORIGINAL_NAME-"}"
            build_name="$stem-$variant"
            if [ -n "$COMBINED_NAME" ]; then
              name="$ARTIFACT_PREFIX-$build_name"
            else
              name="$stem"
            fi
          else
            build_name="$BUILD_ACTION_NAME"
            if [ -n "$COMBINED_NAME" ]; then
              name="$ARTIFACT_PREFIX-$BUILD_ACTION_NAME"
            else
              name="$ORIGINAL_NAME"
            fi
          fi
          echo "name=$name" >> "$GITHUB_OUTPUT"
          echo "build-name=$build_name" >> "$GITHUB_OUTPUT"
      # The artifact name is embedded as the top-level directory of the
      # artifact so that downloading with merge-multiple: true always yields
      # <path>/<artifact-name>/<version>/. download-artifact v5+ no longer
      # creates the per-artifact directory when a download matches only a
      # single artifact (actions/download-artifact#419).
      #
      # When the firmware name differs from the build action's, the first
      # occurrence of the old name in each file name is replaced, and the
      # manifest paths are rewritten to match.
      - name: Move files for versioning
        env:
          ARTIFACT_NAME: ${{ steps.artifact.outputs.name }}
          BUILD_NAME: ${{ steps.artifact.outputs.build-name }}
          BUILD_ACTION_NAME: ${{ steps.esphome-build.outputs.name }}
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          set -euo pipefail
          dest="output/$ARTIFACT_NAME/$VERSION"
          mkdir -p "$dest"
          for src in "$BUILD_ACTION_NAME"/*; do
            file=$(basename "$src")
            mv "$src" "$dest/${file/"$BUILD_ACTION_NAME"/"$BUILD_NAME"}"
          done
          if [ "$BUILD_NAME" != "$BUILD_ACTION_NAME" ]; then
            jq --arg old "$BUILD_ACTION_NAME" --arg new "$BUILD_NAME" '
              def swap: split($old) as $p
                | if ($p | length) > 1 then $p[0] + $new + ($p[1:] | join($old)) else . end;
              if has("builds") then
                .builds |= map(
                  (if .ota.path then .ota.path |= swap else . end)
                  | (if .parts then .parts |= map(.path |= swap) else . end)
                )
              else . end
            ' "$dest/manifest.json" > "$dest/manifest.json.tmp"
            mv "$dest/manifest.json.tmp" "$dest/manifest.json"
          fi
      - name: Upload artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ steps.artifact.outputs.name }}
          path: output

  combine:
    name: Combine manifests
    needs:
      - prepare
      - build
    runs-on: ubuntu-latest
    if: inputs.combined-name != ''
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: files
          pattern: ${{ needs.prepare.outputs.artifact-prefix }}-*
          # Each artifact embeds its name as its top-level directory, so
          # merging yields files/<artifact-name>/<version>/ regardless of
          # how many artifacts match the pattern.
          merge-multiple: true

      - name: Get artifact names
        id: artifacts
        run: |
          artifacts=$(ls --format=single-column files)
          echo "artifacts<<EOF" >> $GITHUB_OUTPUT
          echo "$artifacts" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Delete prefixed artifacts
        uses: geekyeggo/delete-artifact@176a747ab7e287e3ff4787bf8a148716375ca118 # v6.0.0
        with:
          name: ${{ steps.artifacts.outputs.artifacts }}

      - name: Combine all parts into a single manifest
        run: |
          version="${{ needs.prepare.outputs.version }}"
          combined="${{ inputs.combined-name }}"
          mkdir -p "output/$combined/$version"
          pushd files
          for device in *; do
            pushd $device
            pushd $version
            cp * "../../../output/$combined/$version/"
            popd
            popd
          done
          popd
          jq -s '(.[0] | del(.builds)) + {"builds": (reduce .[].builds as $b ([]; . + $b))}' \
            files/*/$version/manifest.json > "output/$combined/$version/manifest.json"

      - name: Upload artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ inputs.combined-name }}
          path: output
