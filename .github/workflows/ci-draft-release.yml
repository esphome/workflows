name: CI Draft Release

# Smoke-tests build-to-draft-release.yml from the PR's own checkout. This
# runs as its own workflow (not a job in ci.yml) because ci.yml's
# test-gh-release job downloads every artifact of its run, and the smoke
# build's artifact carries a different version directory. Only the
# pull_request/push path is exercised here: the draft-release jobs are
# skipped by design (they only run for workflow_run events in consumer
# repositories, and need a live draft release).

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

# The called workflow's draft-release jobs are skipped on these events, but
# GitHub validates every nested job's requested permissions against this
# grant at call time — even jobs that end up skipped — so contents: write
# must be granted for the call to be valid at all. This matches what real
# consumers grant.
permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build-to-draft:
    name: Build to draft release (smoke)
    uses: ./.github/workflows/build-to-draft-release.yml
    with:
      # No files input: exercises the *.factory.yaml auto-discovery, which
      # finds tests/ci-draft.factory.yaml, tests/ci-revision-a.factory.yaml
      # and tests/ci-draft-excluded.factory.yaml. exclude-files then has to
      # drop the last, and verify-artifacts below fails if it was built anyway.
      # The pattern deliberately omits the tests/ directory: matching it
      # against the full path proves * spans /, which is what lets consumers
      # exclude device/device.minimal.factory.yaml without listing any path.
      esphome-version: latest
      exclude-files: "*-excluded.factory.yaml"
      # ci-revision-a's esphome.name is ci-revision, so this proves the input
      # reaches build.yml: without it the firmware would be named
      # ci-revision-esp8266. ci-draft's name already matches its file.
      name-from-file: true

  # A repository publishing several combined manifests from one release (the
  # esphome/firmware shape) makes a single call with `groups`. Proves the
  # build matrix fans a reusable-workflow call out per group, that a group's
  # multi-file `files` array survives the matrix, and that both groups'
  # artifacts land in the same run — which is what lets the one
  # upload-to-draft-release job publish all of them.
  build-to-draft-groups:
    name: Build to draft release (grouped smoke)
    uses: ./.github/workflows/build-to-draft-release.yml
    with:
      esphome-version: latest
      groups: |
        [
          {
            "name": "ci-draft-group-a",
            "files": ["tests/ci-combined-a.yaml", "tests/ci-combined-b.yaml"]
          },
          {
            "name": "ci-draft-group-b",
            "files": ["tests/ci-combined-single.yaml"]
          }
        ]

  verify-artifacts:
    name: Verify artifact layout
    runs-on: ubuntu-latest
    needs:
      - build-to-draft
      - build-to-draft-groups
    steps:
      - name: Download all artifacts (as the upload workflows do)
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: files
          merge-multiple: true

      - name: Tree
        run: tree

      - name: Verify layout
        run: |
          shopt -s nullglob
          fail=0

          # Without a draft release to take a version from, build.yml
          # generates a dev-<timestamp> version. Each call generates its own,
          # so match with a glob rather than assuming one shared value.
          for name in ci-draft ci-revision-a ci-draft-group-a ci-draft-group-b; do
            if ! compgen -G "files/$name/dev-*/manifest.json" > /dev/null; then
              echo "::error::Missing files/$name/dev-*/manifest.json"
              fail=1
            fi
            bins=(files/"$name"/dev-*/*.bin)
            if [ "${#bins[@]}" -eq 0 ]; then
              echo "::error::No firmware binaries in files/$name/dev-*/"
              fail=1
            fi
          done

          # Every group's manifest is present and combines exactly its own
          # files: a group must not absorb another group's builds, and the
          # ungrouped call must stay one manifest per file.
          for spec in ci-draft:1 ci-revision-a:1 ci-draft-group-a:2 ci-draft-group-b:1; do
            name="${spec%:*}"
            expected="${spec#*:}"
            manifests=(files/"$name"/dev-*/manifest.json)
            if [ "${#manifests[@]}" -ne 1 ]; then
              echo "::error::Expected exactly one manifest for $name, found ${#manifests[@]}"
              fail=1
              continue
            fi
            if ! builds=$(jq '.builds | length' "${manifests[0]}"); then
              echo "::error::Failed to read the $name manifest"
              fail=1
            elif [ "$builds" -ne "$expected" ]; then
              echo "::error::$name manifest has $builds builds, expected $expected"
              fail=1
            fi
          done

          # tests/ci-draft-excluded.factory.yaml is discovered by the
          # ungrouped call but must be dropped by its exclude-files pattern.
          # The catch-all below would also flag it; this names it so the
          # failure is unambiguous.
          if [ -e "files/ci-draft-excluded" ]; then
            echo "::error::exclude-files did not work: ci-draft-excluded was built"
            fail=1
          fi

          # name-from-file names ci-revision-a's firmware after its file, and
          # every manifest path must point at a file next to it.
          factory=(files/ci-revision-a/dev-*/ci-revision-a-esp8266.factory.bin)
          if [ "${#factory[@]}" -ne 1 ]; then
            echo "::error::Missing ci-revision-a-esp8266.factory.bin"
            fail=1
          fi
          stale=(files/*/dev-*/*ci-revision-esp8266*)
          if [ "${#stale[@]}" -ne 0 ]; then
            echo "::error::Firmware still named after esphome.name: ${stale[*]}"
            fail=1
          fi
          for manifest in files/ci-revision-a/dev-*/manifest.json; do
            if ! paths=$(jq -r '.builds[] | (.ota.path // empty), (.parts[]?.path)' "$manifest"); then
              echo "::error::Failed to read $manifest"
              fail=1
              continue
            fi
            if [ -z "$paths" ]; then
              echo "::error::$manifest lists no firmware paths"
              fail=1
              continue
            fi
            mapfile -t path_arr <<< "$paths"
            for path in "${path_arr[@]}"; do
              if [ ! -f "$(dirname "$manifest")/$path" ]; then
                echo "::error::$manifest references missing $path"
                fail=1
              fi
            done
          done

          for entry in files/*; do
            case "$(basename "$entry")" in
              ci-draft|ci-revision-a|ci-draft-group-a|ci-draft-group-b) ;;
              *)
                echo "::error::Unexpected top-level entry: $entry"
                fail=1
                ;;
            esac
          done

          exit $fail
