name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

# Default for all jobs; the release jobs override this with contents: write.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: yamllint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Run yamllint
        run: pipx run yamllint .

  test-scripts:
    name: Script tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - name: Run tests
        run: npm test

  # The build scenarios call the reusable workflows from this checkout, so a
  # PR exercises its own changes end-to-end without pointing a consumer
  # repository at a branch ref.
  build-single:
    name: Build (single artifact)
    uses: ./.github/workflows/build.yml
    with:
      files: tests/ci-single.yaml
      release-version: ci-${{ github.run_id }}

  build-combined:
    name: Build (combined artifact)
    uses: ./.github/workflows/build.yml
    with:
      files: |
        tests/ci-combined-a.yaml
        tests/ci-combined-b.yaml
      combined-name: ci-combined
      release-version: ci-${{ github.run_id }}

  # Exercises the combine job's pattern download matching a single artifact —
  # the case where download-artifact v5+ drops the per-artifact directory
  # (actions/download-artifact#419).
  build-combined-single:
    name: Build (combined artifact, single file)
    uses: ./.github/workflows/build.yml
    with:
      files: tests/ci-combined-single.yaml
      combined-name: ci-combined-single
      release-version: ci-${{ github.run_id }}

  # RP2040 builds ship a .uf2 image instead of a .factory.bin, so this covers
  # the non-.bin firmware path through the upload workflows.
  build-rp2040:
    name: Build (RP2040 uf2)
    uses: ./.github/workflows/build.yml
    with:
      files: tests/ci-rp2040.yaml
      release-version: ci-${{ github.run_id }}

  # Two configs sharing esphome.name (hardware revisions) must not collide
  # when the firmware is named after the YAML file instead.
  build-name-from-file:
    name: Build (name from file)
    uses: ./.github/workflows/build.yml
    with:
      files: |
        tests/ci-revision-a.factory.yaml
        tests/ci-revision-b.factory.yaml
      name-from-file: true
      release-version: ci-${{ github.run_id }}

  build-name-from-file-combined:
    name: Build (name from file, combined artifact)
    uses: ./.github/workflows/build.yml
    with:
      files: |
        tests/ci-revision-a.factory.yaml
        tests/ci-revision-b.factory.yaml
      name-from-file: true
      combined-name: ci-revision-combined
      release-version: ci-${{ github.run_id }}

  verify-artifacts:
    name: Verify artifact layout
    runs-on: ubuntu-latest
    needs:
      - build-single
      - build-combined
      - build-combined-single
      - build-rp2040
      - build-name-from-file
      - build-name-from-file-combined
    steps:
      - name: Download all artifacts (as the upload workflows do)
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: files
          merge-multiple: true

      - name: Download one artifact via pattern (single match)
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: single
          pattern: ci-single
          merge-multiple: true

      - name: Tree
        run: tree

      - name: Verify layout
        run: |
          version="ci-${{ github.run_id }}"
          fail=0
          expected_names=(
            ci-single ci-combined ci-combined-single ci-rp2040
            ci-revision-a ci-revision-b ci-revision-combined
          )

          for name in "${expected_names[@]}"; do
            if [ ! -f "files/$name/$version/manifest.json" ]; then
              echo "::error::Missing files/$name/$version/manifest.json"
              fail=1
            fi
          done

          for entry in files/*; do
            case "$(basename "$entry")" in
              ci-single|ci-combined|ci-combined-single|ci-rp2040) ;;
              ci-revision-a|ci-revision-b|ci-revision-combined) ;;
              *)
                echo "::error::Unexpected top-level entry: $entry"
                fail=1
                ;;
            esac
          done

          # A download matching a single artifact must still produce the
          # per-artifact directory (actions/download-artifact#419).
          if [ ! -f "single/ci-single/$version/manifest.json" ]; then
            echo "::error::Single-match download lost the artifact directory"
            fail=1
          fi

          if ! builds=$(jq '.builds | length' "files/ci-combined/$version/manifest.json"); then
            echo "::error::Failed to read the ci-combined manifest"
            fail=1
          elif [ "$builds" -ne 2 ]; then
            echo "::error::ci-combined manifest has $builds builds, expected 2"
            fail=1
          fi

          if ! builds=$(jq '.builds | length' "files/ci-combined-single/$version/manifest.json"); then
            echo "::error::Failed to read the ci-combined-single manifest"
            fail=1
          elif [ "$builds" -ne 1 ]; then
            echo "::error::ci-combined-single manifest has $builds builds, expected 1"
            fail=1
          fi

          if ! builds=$(jq '.builds | length' "files/ci-revision-combined/$version/manifest.json"); then
            echo "::error::Failed to read the ci-revision-combined manifest"
            fail=1
          elif [ "$builds" -ne 2 ]; then
            echo "::error::ci-revision-combined manifest has $builds builds, expected 2"
            fail=1
          fi

          # Both revisions share esphome.name, so name-from-file must keep
          # their firmware files apart, named after the YAML file.
          for rev in ci-revision-a ci-revision-b; do
            for ext in factory.bin ota.bin; do
              if [ ! -f "files/$rev/$version/$rev-esp8266.$ext" ]; then
                echo "::error::Missing files/$rev/$version/$rev-esp8266.$ext"
                fail=1
              fi
            done
          done

          # Nothing may keep the esphome.name-based name.
          leftovers=$(find files -name '*ci-revision-esp8266*')
          if [ -n "$leftovers" ]; then
            echo "::error::Files named after esphome.name were produced:"
            echo "$leftovers"
            fail=1
          fi

          # Every path in a rewritten manifest must exist next to it.
          for name in ci-revision-a ci-revision-b ci-revision-combined; do
            manifest="files/$name/$version/manifest.json"
            if ! paths=$(jq -r '.builds[] | (.ota.path // empty), (.parts[]?.path)' "$manifest"); then
              echo "::error::Failed to read paths from $manifest"
              fail=1
              continue
            fi
            if [ -z "$paths" ]; then
              echo "::error::$manifest lists no file paths"
              fail=1
              continue
            fi
            while IFS= read -r path; do
              if [ ! -f "files/$name/$version/$path" ]; then
                echo "::error::$manifest references missing file $path"
                fail=1
              fi
            done <<< "$paths"
          done

          shopt -s nullglob
          for name in "${expected_names[@]}"; do
            bins=("files/$name/$version/"*.bin)
            if [ "${#bins[@]}" -eq 0 ]; then
              echo "::error::No firmware binaries in files/$name/$version/"
              fail=1
            fi
          done

          uf2s=("files/ci-rp2040/$version/"*.uf2)
          if [ "${#uf2s[@]}" -eq 0 ]; then
            echo "::error::No .uf2 image in files/ci-rp2040/$version/"
            fail=1
          fi

          exit $fail

  # End-to-end test of upload-to-gh-release.yml against a draft release.
  # Skipped for fork PRs, which get a read-only token.
  test-gh-release:
    name: Upload to draft GitHub release
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    needs:
      - build-single
      - build-combined
      - build-combined-single
      - build-rp2040
      - build-name-from-file
      - build-name-from-file-combined
    permissions:
      contents: write
    uses: ./.github/workflows/upload-to-gh-release.yml
    with:
      version: ci-${{ github.run_id }}
      draft: true

  verify-gh-release:
    name: Verify draft release assets
    runs-on: ubuntu-latest
    needs:
      - test-gh-release
    permissions:
      # Write access so the release listing includes drafts.
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: files
          merge-multiple: true

      - name: Verify release assets match the built artifacts
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ci-${{ github.run_id }}
        run: |
          shopt -s nullglob
          expected=$(mktemp)
          for device_dir in files/*; do
            device=$(basename "$device_dir")
            echo "$device.manifest.json" >> "$expected"
            for bin in "$device_dir/$VERSION/"*.{bin,elf,uf2}; do
              b=$(basename "$bin")
              printf '%s\n%s.md5\n%s.sha256\n' "$b" "$b" "$b" >> "$expected"
            done
          done
          sort -u "$expected" -o "$expected"

          if ! releases=$(gh api "repos/$GH_REPO/releases?per_page=100"); then
            echo "::error::Failed to list releases."
            exit 1
          fi
          actual=$(jq -r --arg v "$VERSION" \
            '.[] | select(.tag_name == $v and .draft) | .assets[].name' \
            <<< "$releases" | sort -u)
          if [ -z "$actual" ]; then
            echo "::error::Draft release $VERSION not found or has no assets."
            exit 1
          fi

          if ! diff "$expected" <(printf '%s\n' "$actual"); then
            echo "::error::Draft release assets do not match the artifacts."
            exit 1
          fi

          # The expected list above shares the upload step's extension glob,
          # so also pin the .uf2 assets explicitly in case both drop them.
          uf2s=(files/ci-rp2040/"$VERSION"/*.uf2)
          if [ "${#uf2s[@]}" -eq 0 ]; then
            echo "::error::No .uf2 image in files/ci-rp2040/$VERSION/"
            exit 1
          fi
          for uf2 in "${uf2s[@]}"; do
            b=$(basename "$uf2")
            for asset in "$b" "$b.md5" "$b.sha256"; do
              if ! grep -qxF "$asset" <<< "$actual"; then
                echo "::error::Draft release is missing $asset."
                exit 1
              fi
            done
          done

  cleanup-gh-release:
    name: Delete draft release
    runs-on: ubuntu-latest
    # Clean up even when verification fails, but not when the upload was
    # skipped (fork PR) or never ran.
    if: always() && (needs.test-gh-release.result == 'success' || needs.test-gh-release.result == 'failure')
    needs:
      - test-gh-release
      - verify-gh-release
    permissions:
      contents: write
    steps:
      - name: Delete CI draft release(s)
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ci-${{ github.run_id }}
        run: |
          if ! releases=$(gh api "repos/$GH_REPO/releases?per_page=100"); then
            echo "::error::Failed to list releases."
            exit 1
          fi
          ids=$(jq -r --arg v "$VERSION" \
            '.[] | select(.tag_name == $v and .draft) | .id' <<< "$releases")
          if [ -z "$ids" ]; then
            echo "No draft release to clean up."
            exit 0
          fi
          mapfile -t id_arr <<< "$ids"
          for id in "${id_arr[@]}"; do
            gh api -X DELETE "repos/$GH_REPO/releases/$id"
            echo "Deleted draft release $id"
          done
