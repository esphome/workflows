name: Promote firmware on Cloudflare R2

on:
  workflow_call:
    inputs:
      version:
        description: Version of the firmware to promote
        required: true
        type: string
      directory:
        description: Directory to promote the firmware to
        required: true
        type: string
      channel:
        description: Channel to upload to. "beta" or "production"
        required: false
        type: string
        default: "production"
      manifest-filename:
        description: Filename of the manifest to write.
        required: false
        type: string
        default: manifest.json

jobs:
  promote:
    name: Promote ${{ inputs.version }} to ${{ inputs.channel }}
    runs-on: ubuntu-latest
    environment: ${{ inputs.channel }}
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: files
          # Each artifact built by build.yml embeds its name as its top-level
          # directory, so merging yields files/<artifact-name>/<version>/
          # regardless of how many artifacts the run has. Without merging,
          # download-artifact v5+ drops the per-artifact directory when the
          # run has only a single artifact (actions/download-artifact#419).
          merge-multiple: true

      - name: Build ${{ inputs.manifest-filename }}
        run: |
          mkdir -p output
          version="${{ inputs.version }}"
          manifest_filename="${{ inputs.manifest-filename }}"
          for device in files/*; do
            device=$(basename $device)
            mkdir -p output/$device
            jq --arg version "$version" \
              '.builds[].ota.path |= $version + "/" + . | (.builds[].parts // [])[].path |= $version + "/" + .' \
              files/$device/$version/manifest.json > output/$device/$manifest_filename
          done

      # R2 is S3-compatible and the AWS CLI is preinstalled on the runner, so
      # this needs no third-party action.
      - name: Upload ${{ inputs.manifest-filename }} to R2
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.CLOUDFLARE_R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.CLOUDFLARE_R2_SECRET_ACCESS_KEY }}
          # Required by the SDK but unused by R2.
          AWS_DEFAULT_REGION: auto
          # AWS CLI >= 2.23 adds trailing CRC32 checksums to every upload,
          # which R2 has intermittently rejected. Restore the older behaviour
          # of only sending a checksum when the operation requires one.
          AWS_REQUEST_CHECKSUM_CALCULATION: when_required
          ACCOUNT_ID: ${{ secrets.CLOUDFLARE_R2_ACCOUNT_ID }}
          BUCKET: ${{ secrets.CLOUDFLARE_R2_BUCKET }}
          DIRECTORY: ${{ inputs.directory }}
          SOURCE_DIR: output
        run: |
          set -euo pipefail
          aws s3 cp "${SOURCE_DIR}" "s3://${BUCKET}/${DIRECTORY%/}/" \
            --endpoint-url "https://${ACCOUNT_ID}.r2.cloudflarestorage.com" \
            --recursive \
            --no-progress
