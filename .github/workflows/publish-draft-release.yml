name: Publish Draft Release
# Patches the draft release's *.manifest.json assets with the final release
# notes, then publishes the draft.
#
# The ESPHome GitHub App is optional. When it is configured (the
# ESPHOME_GITHUB_APP_CLIENT_ID variable, resolved against the calling
# repository or its organisation, and the ESPHOME_GITHUB_APP_PRIVATE_KEY
# secret are both present) the job authenticates with an App token, so
# publishing the release fires a downstream `release: published` event.
# Otherwise it falls back to the default GITHUB_TOKEN, which is enough to
# patch the manifests and publish the draft.
#
# IMPORTANT CAVEAT: a release published with GITHUB_TOKEN does NOT emit a
# downstream `release: published` event. GitHub suppresses events for
# actions taken with the default token to prevent recursive workflow runs.
# Consumers that react to a publish must therefore trigger off `workflow_run`
# of their Release workflow on the fallback path rather than off
# `release: published`. (esphome-project-template does exactly this.)

on:
  workflow_call:
    inputs:
      tag:
        description: Release tag to publish (defaults to the most recent draft)
        required: false
        type: string
        default: ""
      environment:
        description: >-
          Deployment environment gating the publish job (must exist in the
          calling repository). Defaults to "release"; pass an empty string to
          run without an environment.
        required: false
        type: string
        default: release
    secrets:
      ESPHOME_GITHUB_APP_PRIVATE_KEY:
        description: Private key of the ESPHome GitHub App
        required: false

jobs:
  release:
    name: Patch manifests and publish
    runs-on: ubuntu-latest
    # The environment (default "release") must exist in the calling
    # repository; it gates publishing behind any protection rules configured
    # there. Outside consumers without such an environment can pass an empty
    # string to opt out.
    environment: ${{ inputs.environment }}
    concurrency:
      group: publish-draft-release-${{ inputs.tag || 'latest-draft' }}
      cancel-in-progress: false
    # contents: write lets the fallback GITHUB_TOKEN read the draft, replace
    # its manifest assets and publish it. When an App token is used instead,
    # GITHUB_TOKEN simply goes unused.
    permissions:
      contents: write
    steps:
      # When the ESPHome GitHub App is configured we mint an App token (not
      # GITHUB_TOKEN) so that publishing the release fires a `release:
      # published` event downstream; the default GITHUB_TOKEN intentionally
      # does not trigger further workflows. When the App is absent this step
      # is skipped and every step below falls back to GITHUB_TOKEN (see the
      # caveat in the header comment).
      - name: Generate a token
        id: generate-token
        if: ${{ vars.ESPHOME_GITHUB_APP_CLIENT_ID != '' }}
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.ESPHOME_GITHUB_APP_CLIENT_ID }}
          private-key: ${{ secrets.ESPHOME_GITHUB_APP_PRIVATE_KEY }}
          # Scope the token to what this job does: read the draft release,
          # replace its manifest assets and publish it.
          permission-contents: write

      - name: Resolve draft release
        id: find
        env:
          GH_TOKEN: ${{ steps.generate-token.outputs.token || github.token }}
          GH_REPO: ${{ github.repository }}
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          if ! releases=$(gh api "repos/${GH_REPO}/releases?per_page=100"); then
            echo "::error::Failed to list releases"
            exit 1
          fi
          tag="${INPUT_TAG}"
          if [[ -z "${tag}" ]]; then
            # Ignore drafts whose tag was reset to an untagged-* placeholder
            # (a stray PATCH without tag_name causes this) — publishing one
            # would create a release under the placeholder tag.
            tag=$(jq -r \
              '[.[] | select(.draft == true and (.tag_name | startswith("untagged-") | not))]
                | first | .tag_name // ""' \
              <<< "${releases}")
          fi
          if [[ -z "${tag}" || "${tag}" == "null" ]]; then
            echo "::error::No draft release found"
            exit 1
          fi
          release=$(jq --arg tag "${tag}" \
            '[.[] | select(.tag_name == $tag and .draft == true)] | first' <<< "${releases}")
          if [[ -z "${release}" || "${release}" == "null" ]]; then
            echo "::error::Draft release ${tag} not found"
            exit 1
          fi
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"
          echo "release_id=$(jq -r '.id' <<< "${release}")" >> "$GITHUB_OUTPUT"
          # Do NOT use the draft's html_url: for a draft it always points at
          # an untagged-* placeholder that 404s once the release is
          # published. The final URL is deterministic from the tag.
          echo "url=https://github.com/${GH_REPO}/releases/tag/${tag}" >> "$GITHUB_OUTPUT"
          {
            echo "body<<RELEASE_BODY_EOF"
            jq -r '.body' <<< "${release}"
            echo "RELEASE_BODY_EOF"
          } >> "$GITHUB_OUTPUT"
          echo "Resolved draft release: ${tag}"

      - name: Download manifest assets
        env:
          GH_TOKEN: ${{ steps.generate-token.outputs.token || github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_ID: ${{ steps.find.outputs.release_id }}
        run: |
          set -euo pipefail
          mkdir -p assets
          # Work with the release id resolved above instead of `gh release
          # download <tag>`: gh resolves draft tags via the singular
          # releases/tags/{tag} endpoint, which has proven unreliable, while
          # lookups by id always work.
          if ! assets=$(gh api "repos/${GH_REPO}/releases/${RELEASE_ID}/assets" \
            --paginate \
            --jq '.[] | select(.name | endswith(".manifest.json")) | "\(.id)\t\(.name)"'); then
            echo "::error::Failed to list draft release assets"
            exit 1
          fi
          if [[ -z "${assets}" ]]; then
            echo "::error::No *.manifest.json assets found on draft release"
            exit 1
          fi
          # curl, not `gh api`: gh refuses to write a response body holding
          # terminal escape bytes (a manifest embedding one in the release
          # body trips that), and its --allow-escape-sequences opt-out needs
          # gh >= 2.97.0, which the runner images do not all ship.
          # -f so an HTTP error fails the step instead of writing the error
          # body as a manifest; -L because the asset endpoint redirects to
          # signed storage (which rejects a forwarded Authorization header,
          # so no --location-trusted).
          while IFS=$'\t' read -r asset_id asset_name; do
            echo "Downloading ${asset_name}"
            curl -fsSL \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "Accept: application/octet-stream" \
              "https://api.github.com/repos/${GH_REPO}/releases/assets/${asset_id}" \
              -o "assets/${asset_name}"
          done <<< "${assets}"

      - name: Patch manifests with current release body
        env:
          RELEASE_SUMMARY: ${{ steps.find.outputs.body }}
          RELEASE_URL: ${{ steps.find.outputs.url }}
        run: |
          set -euo pipefail
          mkdir -p patched
          for manifest in assets/*.manifest.json; do
            jq --arg summary "${RELEASE_SUMMARY}" --arg url "${RELEASE_URL}" \
              '.builds[].ota |= (.summary = $summary | .release_url = $url)' \
              "${manifest}" > "patched/$(basename "${manifest}")"
          done

      - name: Re-upload patched manifests to draft release
        env:
          GH_TOKEN: ${{ steps.generate-token.outputs.token || github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_ID: ${{ steps.find.outputs.release_id }}
        run: |
          set -euo pipefail
          # Upload by release id rather than `gh release upload <tag>
          # --clobber` for the same reason as the download step: draft-by-tag
          # resolution is unreliable. Clobber semantics are replicated by
          # deleting any same-named asset before uploading.
          if ! existing=$(gh api "repos/${GH_REPO}/releases/${RELEASE_ID}/assets" \
            --paginate \
            --jq '.[] | "\(.id)\t\(.name)"'); then
            echo "::error::Failed to list draft release assets"
            exit 1
          fi
          for manifest in patched/*.manifest.json; do
            name=$(basename "${manifest}")
            asset_id=$(awk -F'\t' -v name="${name}" '$2 == name {print $1; exit}' <<< "${existing}")
            if [[ -n "${asset_id}" ]]; then
              echo "Deleting existing asset ${name} (${asset_id})"
              gh api "repos/${GH_REPO}/releases/assets/${asset_id}" \
                --method DELETE --silent
            fi
            echo "Uploading ${name}"
            gh api --method POST \
              -H "Content-Type: application/json" \
              "https://uploads.github.com/repos/${GH_REPO}/releases/${RELEASE_ID}/assets?name=${name}" \
              --input "${manifest}" --silent
          done

      - name: Publish release
        env:
          GH_TOKEN: ${{ steps.generate-token.outputs.token || github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_ID: ${{ steps.find.outputs.release_id }}
          TAG: ${{ steps.find.outputs.tag }}
        run: |
          set -euo pipefail
          # Publish by id, not `gh release edit <tag> --draft=false`: besides
          # the unreliable draft-by-tag resolution, gh sends a PATCH with only
          # draft=false — and updating a draft without re-sending tag_name
          # resets its tag to an untagged-* placeholder, which would then be
          # published as the release tag.
          gh api "repos/${GH_REPO}/releases/${RELEASE_ID}" \
            --method PATCH \
            --field "tag_name=${TAG}" \
            --field "name=${TAG}" \
            --field "draft=false" \
            --silent
          echo "Published ${TAG}"
