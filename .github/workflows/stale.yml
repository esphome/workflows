---
name: Stale issues and PRs
# This workflow is only to be used within the ESPHome organisation on GitHub:
# it authenticates with the ESPHome GitHub App via the
# ESPHOME_GITHUB_APP_CLIENT_ID variable (resolved against the calling
# repository or its organisation) and the ESPHOME_GITHUB_APP_PRIVATE_KEY
# secret, so that everything it does is attributed to esphome[bot].

on:
  workflow_call:
    inputs:
      days-before-stale:
        description: Days without real activity before an item is marked stale
        required: false
        type: number
        default: 90
      days-before-stale-conflicting:
        description: >
          Days after a PR is labelled for merge conflicts before it is marked
          stale if they are still unresolved, regardless of other activity.
          0 (the default) disables conflict handling altogether
        required: false
        type: number
        default: 0
      days-before-close:
        description: Days after the stale label before an item is closed
        required: false
        type: number
        default: 7
      stale-label:
        description: Label used to mark stale items
        required: false
        type: string
        default: stale
      exempt-label:
        description: Items with this label are never marked or closed
        required: false
        type: string
        default: not-stale
      conflict-label:
        description: >
          Label added, with a request-changes review, as soon as a PR has
          merge conflicts. While it is present, comments do not unmark a
          stale PR; only resolving the conflicts does. Removed, and the
          review dismissed, once the PR is mergeable
        required: false
        type: string
        default: needs-rebase
      stale-pr-message:
        description: Comment posted when a PR is marked stale
        required: false
        type: string
        default: >
          There hasn't been any activity on this pull request recently. This
          pull request has been automatically marked as stale because of that
          and will be closed if no further activity occurs.

          If you are the author of this PR, please leave a comment if you want
          to keep it open. Also, please rebase your PR onto the latest
          development branch to ensure that it's up to date with the latest
          changes.

          Thank you for your contribution!
      conflict-pr-message:
        description: >
          Body of the request-changes review submitted when a PR is labelled
          for merge conflicts. The review is dismissed once the PR is
          mergeable again
        required: false
        type: string
        default: >
          This pull request has merge conflicts. Please merge the latest
          development branch into your branch to resolve them.
      stale-conflicting-pr-message:
        description: Comment posted when a PR with unresolved merge conflicts is marked stale
        required: false
        type: string
        default: >
          The merge conflicts on this pull request have not been resolved, so
          it has been marked as stale and will be closed if they are not
          resolved soon.

          Please merge the latest development branch into your branch. Once
          the pull request is mergeable again the stale label is removed.

          Thank you for your contribution!
      stale-issue-message:
        description: Comment posted when an issue is marked stale
        required: false
        type: string
        default: >
          There hasn't been any activity on this issue recently. Due to the
          high number of incoming GitHub notifications, we have to clean some
          of the old issues, as many of them have already been resolved with
          the latest updates.

          Please make sure to update to the latest version and check if that
          solves the issue. Let us know if that works for you by adding a
          comment 👍

          This issue has now been marked as stale and will be closed if no
          further activity occurs. Thank you for your contributions.
      ignored-users:
        description: >
          Comma-separated logins whose comments and reviews do not count as
          activity — for machine accounts of type User, which the automatic
          bot filter cannot detect (App bots are always ignored)
        required: false
        type: string
        default: ''
      conflicts-only:
        description: >
          Only handle merge conflicts: add or remove the conflict label (and its
          review) and unmark stale PRs that are mergeable again. Skips
          issues, stale marking, closing and the activity checks, so it is
          cheap enough to run several times a day alongside a daily full run.
          Requires days-before-stale-conflicting to be set
        required: false
        type: boolean
        default: false
      dry-run:
        description: Log what would happen without labeling, commenting or closing
        required: false
        type: boolean
        default: false
    secrets:
      ESPHOME_GITHUB_APP_PRIVATE_KEY:
        description: Private key of the ESPHome GitHub App
        required: true

# Every API call uses the ESPHome GitHub App token; GITHUB_TOKEN is never used.
permissions: {}

concurrency:
  group: stale
  cancel-in-progress: false

jobs:
  stale:
    runs-on: ubuntu-latest
    steps:
      # A GitHub App token (not GITHUB_TOKEN) so that the stale label,
      # comment and closure are attributed to esphome[bot], which is a Bot
      # account and therefore never counted as real activity by the check
      # below.
      - name: Generate a token
        id: generate-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1  # v3.2.0
        with:
          client-id: ${{ vars.ESPHOME_GITHUB_APP_CLIENT_ID }}
          private-key: ${{ secrets.ESPHOME_GITHUB_APP_PRIVATE_KEY }}
          # Scope the minted App token to the minimum the script below needs.
          permission-contents: read        # repos.getCommit for the PR head commit date (REST fallback)
          permission-issues: write         # list/create comments, add/remove labels, close issues
          permission-pull-requests: write  # GraphQL PR reads, pulls.get, reviews and closing PRs

      # The script lives in this repository, not the caller's, so check it
      # out at the exact commit the caller pinned this workflow to
      - name: Check out the stale script
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .esphome-workflows
          sparse-checkout: scripts/stale
          persist-credentials: false

      - name: Process stale issues and PRs
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3  # v9.0.0
        with:
          github-token: ${{ steps.generate-token.outputs.token }}
          script: |
            const run = require(`${process.env.GITHUB_WORKSPACE}/.esphome-workflows/scripts/stale/index.js`);
            await run({github, context, core});
        env:
          STALE_DAYS_BEFORE_STALE: ${{ inputs.days-before-stale }}
          STALE_DAYS_BEFORE_STALE_CONFLICTING: ${{ inputs.days-before-stale-conflicting }}
          STALE_DAYS_BEFORE_CLOSE: ${{ inputs.days-before-close }}
          STALE_LABEL: ${{ inputs.stale-label }}
          STALE_EXEMPT_LABEL: ${{ inputs.exempt-label }}
          STALE_CONFLICT_LABEL: ${{ inputs.conflict-label }}
          STALE_IGNORED_USERS: ${{ inputs.ignored-users }}
          STALE_CONFLICTS_ONLY: ${{ inputs.conflicts-only }}
          STALE_DRY_RUN: ${{ inputs.dry-run }}
          # The App's own login, to find the conflict reviews it submitted
          STALE_BOT_LOGIN: ${{ steps.generate-token.outputs.app-slug }}[bot]
          STALE_PR_MESSAGE: ${{ inputs.stale-pr-message }}
          STALE_CONFLICT_PR_MESSAGE: ${{ inputs.conflict-pr-message }}
          STALE_CONFLICTING_PR_MESSAGE: ${{ inputs.stale-conflicting-pr-message }}
          STALE_ISSUE_MESSAGE: ${{ inputs.stale-issue-message }}
