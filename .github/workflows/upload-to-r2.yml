name: Upload firmware to Cloudflare R2
# This workflow is only to be used within the ESPHome organisation on GitHub.
# It is used to build and upload the binaries to Cloudflare R2 and only
# specific repositories will be granted the secrets required to do so.

on:
  workflow_call:
    inputs:
      directory:
        description: Directory to upload to
        required: true
        type: string

jobs:
  upload:
    name: Upload
    runs-on: ubuntu-latest
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: files
          # Each artifact built by build.yml embeds its name as its top-level
          # directory, so merging yields files/<artifact-name>/<version>/
          # regardless of how many artifacts the run has. Without merging,
          # download-artifact v5+ drops the per-artifact directory when the
          # run has only a single artifact (actions/download-artifact#419).
          merge-multiple: true

      - run: tree

      # R2 is S3-compatible and the AWS CLI is preinstalled on the runner, so
      # this needs no third-party action.
      - name: Upload files to R2
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.CLOUDFLARE_R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.CLOUDFLARE_R2_SECRET_ACCESS_KEY }}
          # Required by the SDK but unused by R2.
          AWS_DEFAULT_REGION: auto
          # AWS CLI >= 2.23 adds trailing CRC32 checksums to every upload,
          # which R2 has intermittently rejected. Restore the older behaviour
          # of only sending a checksum when the operation requires one.
          AWS_REQUEST_CHECKSUM_CALCULATION: when_required
          ACCOUNT_ID: ${{ secrets.CLOUDFLARE_R2_ACCOUNT_ID }}
          BUCKET: ${{ secrets.CLOUDFLARE_R2_BUCKET }}
          DIRECTORY: ${{ inputs.directory }}
          SOURCE_DIR: files
        run: |
          set -euo pipefail
          aws s3 cp "${SOURCE_DIR}" "s3://${BUCKET}/${DIRECTORY%/}/" \
            --endpoint-url "https://${ACCOUNT_ID}.r2.cloudflarestorage.com" \
            --recursive \
            --no-progress
